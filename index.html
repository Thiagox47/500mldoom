<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protótipo Doom — 500ml Stories</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #0a0b0d; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; }
      #wrap { position: relative; width: min(96vw, calc(96vh * 1.6)); }
      canvas {
        display: block; width: 100%; height: auto;
        image-rendering: pixelated; background: #000;
        border: 1px solid #22262c; box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      }
      #overlay {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: rgba(8, 9, 12, 0.82); color: #d8d8d2;
        text-align: center; cursor: pointer; user-select: none;
      }
      #overlay h1 { font-size: clamp(22px, 4vw, 42px); letter-spacing: 6px; color: #c8342c; text-transform: uppercase; }
      #overlay p { color: #9aa0aa; font-size: 14px; letter-spacing: 1px; }
      #overlay .keys { color: #d8d8d2; }
      #overlay-hint { margin-top: 10px; color: #e8c23c; animation: pulse 1.2s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="640" height="400"></canvas>
      <div id="overlay">
        <h1 id="overlay-title">Protótipo Doom</h1>
        <p class="keys">WASD mover &nbsp;·&nbsp; Mouse mirar &nbsp;·&nbsp; Clique atirar &nbsp;·&nbsp; M minimapa</p>
        <p id="overlay-hint">Clique para começar</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
